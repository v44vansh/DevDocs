[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devdocs-api"
version = "0.1.0"
description = "Offline-friendly FastAPI backend for DevDocs AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "pypdf==5.1.0",
    "python-multipart==0.0.20",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
